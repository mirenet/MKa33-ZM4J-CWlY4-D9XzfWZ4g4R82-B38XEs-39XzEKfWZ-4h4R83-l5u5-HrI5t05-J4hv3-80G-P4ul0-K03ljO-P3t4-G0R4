<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    width: 100%;
    height: 100%;
}
</style>

<script>
let player;

function getVideoId() {
    return new URLSearchParams(window.location.search).get("v");
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: getVideoId(),

        playerVars: {
            autoplay: 1,
            controls: 0,
            rel: 0,
            playsinline: 1,
            enablejsapi: 1
        },

        events: {
            onReady: onReady,
            onStateChange: onStateChange,
            onError: onError 
        }
    });
}

let lastKnownTime = 0;
let seekCheckInterval = null;

function onReady(event) { 
    event.target.playVideo();
    
    // Zadržavamo interval za regularan rad u prvom planu, ali oslonac za seek na Androidu je onStateChange
    if (seekCheckInterval) clearInterval(seekCheckInterval);
    seekCheckInterval = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        try {
            const currentTime = player.getCurrentTime();
            const playerState = player.getPlayerState();

            if (playerState === YT.PlayerState.PLAYING) {
                if (Math.abs(currentTime - lastKnownTime) > 1.5) {
                    parent.postMessage({
                        type: "seek",
                        currentTime: currentTime 
                    }, "*"); 
                }
                lastKnownTime = currentTime; 
            }
        } catch (e) {} 
    }, 500);
}

function onStateChange(event) {
    // Kada plejer krene (uključujući i nakon pomeranja seekbara u notifikaciji)
    if (event.data === YT.PlayerState.PLAYING) {
        if (player && typeof player.getCurrentTime === 'function') {
            const currentTime = player.getCurrentTime();
            
            // Provera da li se vreme drastično promenilo (što znači da je korisnik pomerio seekbar)
            if (Math.abs(currentTime - lastKnownTime) > 1.5) {
                parent.postMessage({ 
                    type: "seek", 
                    currentTime: currentTime 
                }, "*");
            }
            lastKnownTime = currentTime;
        }
        parent.postMessage({ type: "playing" }, "*");
    }

    if (event.data === YT.PlayerState.PAUSED) {
        parent.postMessage({ type: "paused" }, "*");
    }

    if (event.data === YT.PlayerState.BUFFERING) {
        parent.postMessage({ type: "buffering" }, "*");
    }

    if (event.data === YT.PlayerState.ENDED) {
        parent.postMessage({ type: "ended" }, "*");
    }
}

// Error Handling
const errorMessages = {
    2: "Wrong video-id!",
    5: "Error with player!",
    100: "Video not found!",
    101: "Embed is not allowed!",
    150: "Embed is not allowed!"
};

function onError(event) {
    const code = event.data;
    const message = errorMessages[code] || `Cant play video! (Error: ${code})`;

    parent.postMessage({
        type: "error",
        message: message 
    }, "*");
}



window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "externalSeek") {
        if (player && typeof player.seekTo === 'function') {
            player.seekTo(e.data.seekTime, true);
            lastKnownTime = e.data.seekTime;
        }
    }
});


    
</script>

</head>
<body>
<div id="player"></div>
</body>
</html>
