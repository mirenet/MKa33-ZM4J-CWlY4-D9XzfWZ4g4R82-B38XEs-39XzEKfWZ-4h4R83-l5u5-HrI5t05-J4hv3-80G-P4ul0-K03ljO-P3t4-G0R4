<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    width: 100%;
    height: 100%;
}
</style>

<script>
let player;
let lastKnownTime = 0;
let nextTrackData = null; // Ovde čuvamo info o sledećoj pesmi koju pošalje roditelj

function getVideoId() {
    return new URLSearchParams(window.location.search).get("v");
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: getVideoId(),

        playerVars: {
            autoplay: 1,
            controls: 0,
            rel: 0,
            playsinline: 1,
            enablejsapi: 1
        },

        events: {
            onReady: onReady,
            onStateChange: onStateChange,
            onError: onError 
        }
    });
}

function onReady(event) { 
    event.target.playVideo();
    initMediaSession(); // Inicijalizujemo osnovnu sesiju kad se plejer učita
}

function onStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        if (player && typeof player.getCurrentTime === 'function') {
            const currentTime = player.getCurrentTime();
            
            parent.postMessage({ 
                type: "playing", 
                currentTime: currentTime 
            }, "*");
            
            if (Math.abs(currentTime - lastKnownTime) > 1.5) {
                parent.postMessage({ 
                    type: "seek", 
                    currentTime: currentTime 
                }, "*");
            }
            lastKnownTime = currentTime;
        } else {
            parent.postMessage({ type: "playing" }, "*");
        }
    }

    if (event.data === YT.PlayerState.PAUSED) {
        parent.postMessage({ type: "paused" }, "*");
    }

    if (event.data === YT.PlayerState.BUFFERING) {
        parent.postMessage({ type: "buffering" }, "*");
    }

    if (event.data === YT.PlayerState.ENDED) {
        parent.postMessage({ type: "ended" }, "*");
    }
}

// Error Handling
const errorMessages = {
    2: "Wrong video-id!",
    5: "Error with player!",
    100: "Video not found!",
    101: "Embed is not allowed!",
    150: "Embed is not allowed!"
};

function onError(event) {
    const code = event.data;
    const message = errorMessages[code] || `Cant play video! (Error: ${code})`;

    parent.postMessage({
        type: "error",
        message: message 
    }, "*");
}

// Slušalac poruka sa lokalne strane (prima spoljne komande i info o sledećoj pesmi)
window.addEventListener("message", function(e) {
    if (!e.data) return;

    // 1. Seek komanda sa notifikacije
    if (e.data.type === "externalSeek") {
        if (player && typeof player.seekTo === 'function') {
            player.seekTo(e.data.seekTime, true);
            lastKnownTime = e.data.seekTime;
        }
    }

    // 2. Primanje informacija o SLEDEĆOJ pesmi od roditeljske aplikacije
    if (e.data.type === "setNextTrack") {
        nextTrackData = e.data; // Sačuvamo podatke
        
        // Ažuriramo MediaSession da uključi akciju za prelazak na sledeću pesmu
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('nexttrack', function() {
                // Kada korisnik klikne Next u Android notifikaciji, obaveštavamo roditelja
                parent.postMessage({ type: "triggerNext" }, "*");
            });
        }
    }
});

// Osnovna MediaSession inicijalizacija za iframe
function initMediaSession() {
    if ('mediaSession' in navigator) {
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: "Pustaj Muziku",
                artist: "Online Player",
                album: "Streaming",
                artwork: [
                    { src: 'https://cdn-icons-png.flaticon.com/512/3163/3163611.png', sizes: '512x512', type: 'image/png' }
                ]
            });

            navigator.mediaSession.playbackState = "playing";

            // Seekbar sa notifikacije
            navigator.mediaSession.setActionHandler('seekto', function(details) {
                if (details.seekTime !== undefined) {
                    if (player && typeof player.seekTo === 'function') {
                        player.seekTo(details.seekTime, true);
                        lastKnownTime = details.seekTime;
                    }
                    parent.postMessage({ type: "externalSeek", seekTime: details.seekTime }, "*");
                }
            });
        } catch (error) {
            console.log("MediaSession error in iframe:", error);
        }
    }
}
</script>

</head>
<body>
<div id="player"></div>
</body>
</html>
