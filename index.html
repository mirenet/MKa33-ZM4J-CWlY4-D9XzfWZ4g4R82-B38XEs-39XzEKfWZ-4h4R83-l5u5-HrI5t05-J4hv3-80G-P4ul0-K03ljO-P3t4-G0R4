<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    width: 100%;
    height: 100%;
}

/* Stilizacija za Next dugme unutar iframe-a (možeš ga podesiti da bude vidljivo ili sakriveno) */
#iframeNextBtn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 9999;
    opacity: 0.7;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 4px;
    font-family: sans-serif;
    cursor: pointer;
}
</style>

<script>
let player;
let lastKnownTime = 0;

function getVideoId() {
    return new URLSearchParams(window.location.search).get("v");
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: getVideoId(),

        playerVars: {
            autoplay: 1,
            controls: 0,
            rel: 0,
            playsinline: 1,
            enablejsapi: 1
        },

        events: {
            onReady: onReady,
            onStateChange: onStateChange,
            onError: onError 
        }
    });
}

function onReady(event) { 
    event.target.playVideo();
}

function onStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        if (player && typeof player.getCurrentTime === 'function') {
            const currentTime = player.getCurrentTime();
            
            // Šaljemo "playing" poruku zajedno sa tačnim vremenom
            parent.postMessage({ 
                type: "playing", 
                currentTime: currentTime 
            }, "*");
            
            // Provera da li se vreme drastično promenilo (seek preko notifikacije)
            if (Math.abs(currentTime - lastKnownTime) > 1.5) {
                parent.postMessage({ 
                    type: "seek", 
                    currentTime: currentTime 
                }, "*");
            }
            lastKnownTime = currentTime;
        } else {
            parent.postMessage({ type: "playing" }, "*");
        }
    }

    if (event.data === YT.PlayerState.PAUSED) {
        parent.postMessage({ type: "paused" }, "*");
    }

    if (event.data === YT.PlayerState.BUFFERING) {
        parent.postMessage({ type: "buffering" }, "*");
    }

    if (event.data === YT.PlayerState.ENDED) {
        parent.postMessage({ type: "ended" }, "*");
    }
}

// Error Handling
const errorMessages = {
    2: "Wrong video-id!",
    5: "Error with player!",
    100: "Video not found!",
    101: "Embed is not allowed!",
    150: "Embed is not allowed!"
};

function onError(event) {
    const code = event.data;
    const message = errorMessages[code] || `Cant play video! (Error: ${code})`;

    parent.postMessage({
        type: "error",
        message: message 
    }, "*");
}

// Slušalac za spoljne komande (MediaSession / Seek sa Android notifikacije)
window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "externalSeek") {
        if (player && typeof player.seekTo === 'function') {
            player.seekTo(e.data.seekTime, true);
            lastKnownTime = e.data.seekTime;
        }
    }
});

// Inicijalizacija klika na Next dugme unutar iframe-a
window.addEventListener('DOMContentLoaded', () => {
    const nextBtn = document.getElementById('iframeNextBtn');
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            parent.postMessage({ type: "triggerNext" }, "*");
        });
    }
});
</script>

</head>
<body>
<div id="player"></div>
<button id="iframeNextBtn">NEXT ➡️</button>
</body>
</html>
