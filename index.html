<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player Proxy</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    #player {
        width: 100%;
        height: 100%;
    }
</style>
</head>
<body>

<div id="player"></div>

<script>
let player;

function getVideoId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('v');
}

function onYouTubeIframeAPIReady() {
    const videoId = getVideoId();
    if (!videoId) return;

    player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: videoId,
        playerVars: {
            'autoplay': 1,
            'controls': 0,
            'rel': 0,
            'playsinline': 1,
            'enablejsapi': 1
        },
        events: {
            'onReady': onReady,
            'onStateChange': onStateChange,
            'onError': onError
        }
    });
}

function onReady(event) {
    event.target.playVideo();
}

// Memorijska petlja (Heartbeat) koja se vrti u iframe-u i šalje signale roditelju
setInterval(() => {
    if (player && typeof player.getPlayerState === 'function') {
        try {
            // Ako plejer svira (bilo iz mreže, bilo iz keša dok internet ne radi)
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                window.parent.postMessage({ type: "heartbeat" }, "*");
            }
        } catch (e) {
            // Ignoriše ako prozor nije dostupan
        }
    }
}, 500);

function onStateChange(event) {
    // Kada video stvarno krene
    if (event.data === YT.PlayerState.PLAYING) {
        window.parent.postMessage({ type: "playing" }, "*");
    }
    
    // Kada se video završi
    if (event.data === YT.PlayerState.ENDED) {
        window.parent.postMessage({ type: "ended" }, "*");
    }
}

function onError(event) {
    window.parent.postMessage({ type: "error", message: "YouTube Error: " + event.data }, "*");
}
</script>

</body>
</html>
