<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;

function getVideoId() {
    return new URLSearchParams(window.location.search).get("v");
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%", height: "100%",
        videoId: getVideoId(),
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, enablejsapi: 1 },
        events: { onReady: onReady, onStateChange: onStateChange, onError: onError }
    });
}

function onReady(event) {
    event.target.playVideo();
}

function onStateChange(event) {
    // 1 = PLAYING (Video ide, bilo sa mreže, bilo iz keša)
    if (event.data === YT.PlayerState.PLAYING) {
        parent.postMessage({ type: "playing" }, "*");
    }
    // 3 = BUFFERING (Keš se ispraznio, nema neta, video je stao da čeka podatke)
    if (event.data === YT.PlayerState.BUFFERING) {
        parent.postMessage({ type: "buffering" }, "*");
    }
    // 0 = ENDED
    if (event.data === YT.PlayerState.ENDED) {
        parent.postMessage({ type: "ended" }, "*");
    }
}

function onError(event) {
    parent.postMessage({ type: "error", message: "Error: " + event.data }, "*");
}
</script>
</head>
<body style="margin:0;background:black;"><div id="player" style="width:100%;height:100%;"></div></body>
</html>
