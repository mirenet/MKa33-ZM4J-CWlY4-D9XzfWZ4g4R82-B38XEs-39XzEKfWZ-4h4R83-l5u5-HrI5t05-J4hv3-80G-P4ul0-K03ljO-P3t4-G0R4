<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player Proxy</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    #player {
        width: 100%;
        height: 100%;
    }
</style>
</head>
<body>

<div id="player"></div>

<script>
let player;

// Uzimamo ID videa iz URL-a (npr. ?v=VIDEO_ID)
function getVideoId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('v');
}

function onYouTubeIframeAPIReady() {
    const videoId = getVideoId();
    if (!videoId) return;

    player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: videoId,
        playerVars: {
            'autoplay': 1,
            'controls': 0,
            'rel': 0,
            'playsinline': 1,
            'enablejsapi': 1
        },
        events: {
            'onReady': onReady,
            'onStateChange': onStateChange,
            'onError': onError
        }
    });
}

function onReady(event) {
    event.target.playVideo();
}

// Lokalna petlja (Heartbeat) koja radi i offline iz keša browsera
setInterval(() => {
    if (player && typeof player.getPlayerState === 'function') {
        try {
            let state = player.getPlayerState();
            
            // Ako je video u PLAYING stanju, obnavljamo heartbeat u localStorage
            if (state === YT.PlayerState.PLAYING) {
                localStorage.setItem('yt_heartbeat', Date.now());
            }
        } catch (e) {
            // Ignoriše greške ako je pretraživač restriktivan
        }
    }
}, 1000);

function onStateChange(event) {
    // 1 = PLAYING
    if (event.data === YT.PlayerState.PLAYING) {
        localStorage.setItem('yt_heartbeat', Date.now());
        parent.postMessage({ type: "playing" }, "*");
    }
    
    // 0 = ENDED (Završen video)
    if (event.data === YT.PlayerState.ENDED) {
        parent.postMessage({ type: "ended" }, "*");
    }
}

function onError(event) {
    parent.postMessage({ type: "error", message: "YouTube Error: " + event.data }, "*");
}
</script>

</body>
</html>
