<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;

function getVideoId() {
    return new URLSearchParams(window.location.search).get("v");
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%", height: "100%",
        videoId: getVideoId(),
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1 },
        events: { onReady: onReady, onStateChange: onStateChange, onError: onError }
    });
}

function onReady(event) {
    event.target.playVideo();
}

// Slušamo zahteve (ping) od tvog lokalnog koda
window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "ping") {
        // Vraćamo potvrdu da smo živi
        event.source.postMessage({ type: "pong" }, e.origin);
    }
});

function onStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        parent.postMessage({ type: "playing" }, "*");
    }
    if (event.data === YT.PlayerState.ENDED) {
        parent.postMessage({ type: "ended" }, "*");
    }
}

function onError(event) {
    parent.postMessage({ type: "error", message: "Error code: " + event.data }, "*");
}
</script>
</head>
<body style="margin:0;background:black;"><div id="player" style="width:100%;height:100%;"></div></body>
</html>
