<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>
<script src="https://www.youtube.com/iframe_api">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: black;
}

#player {
width: 100%;
height: 100%;
}
</style>

<script>

let player;

// Get Video-ID
function getVideoId() {
return new URLSearchParams(window.location.search).get("v"); }

function onYouTubeIframeAPIReady() {
player = new YT.Player("player", { 
width: "100%",
height: "100%",
videoId: getVideoId() || "", // Ako nema ID u url, ostaje prazan do poruke
enablejsapi: 1,
host: 'https://www.youtube-nocookie.com',
origin: window.location.origin,
    
playerVars: {
playlist: getVideoId() || "",
autoplay: 1,
controls: 0,
showinfo: 0,
iv_load_policy: 3,
cc_load_policy: 1,
autohide: 0,
fs: 0,
hl: sq,
cc_lang_pref: sq,
playsinline: 1,
start: 60,
rel: 0
},

events: { 
onReady: onReady,
onStateChange: onStateChange,
onError: onError 
}}); }

// Load/Stop
window.addEventListener("message", function(e) {
    if (e.data.type === "loadVideo") {
        if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById(e.data.videoId);
        }
    } 
    // 👉 STOP:
    else if (e.data.type === "stopVideo") {
        if (player && typeof player.stopVideo === 'function') {
            player.stopVideo(); // Ovo je prava YouTube API komanda za stop
        }
    }
});

function onReady(event) {
event.target.playVideo();
}

function onStateChange(event) {
if (event.data === YT.PlayerState.ENDED) {
parent.postMessage({ type: "ended" }, "*"); }}

// Error Handling
const errorMessages = {
2: "Wrong video-id!",
5: "Error with player!",
100: "Video not found!",
101: "Embed is not allowed!",
150: "Embed is not allowed!"
};

function onError(event) {
const code = event.data;
const message = errorMessages[code] || `Cant play video! (Error: ${code})`;

parent.postMessage({
type: "error",
message: message }, "*"); }
</script>
</head>
<body>
<div id="player"></div>
</body>
</html>
